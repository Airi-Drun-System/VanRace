<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#6fb3e8">
<title>Фургонные гонки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&family=Rubik:wght@500;800&display=swap">
<style>
/* Мультяшная гонка на закате: один «мир», одна тема. Крупные пальцевые кнопки по краям экрана. */
:root{
  --ink:#1d1630; --paper:#fff6e8; --gas:#ff7a2f; --brake:#3a8dde; --gold:#ffd04a; --dim:rgba(29,22,48,.55);
  --display:"Rubik Bubbles","Arial Black",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:#6fb3e8;touch-action:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font:800 15px var(--body);color:var(--paper);pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.pill{background:rgba(29,22,48,.55);border-radius:14px;padding:6px 11px;backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
#place{font:400 30px var(--display);line-height:1}
#cargo{display:flex;gap:3px;align-items:center}
.track{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));height:10px;border-radius:6px;background:rgba(29,22,48,.45);pointer-events:none}
.dot{position:absolute;top:-3px;width:16px;height:16px;border-radius:50%;margin-left:-8px;border:2px solid var(--paper)}
.flag{position:absolute;right:-2px;top:-8px;font:800 11px var(--body);color:var(--paper)}
.btn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:clamp(96px,min(24vw,30vh),150px);height:clamp(96px,min(24vw,30vh),150px);border-radius:28px;border:0;
  font:400 clamp(20px,min(5vw,6vh),30px) var(--display);color:#fff;box-shadow:0 7px 0 rgba(0,0,0,.35);touch-action:none;cursor:pointer}
.btn:active,.btn.on{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#gas{right:max(18px,env(safe-area-inset-right,0px));background:var(--gas)}
#brake{left:max(18px,env(safe-area-inset-left,0px));background:var(--brake)}
#horn{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 34px);left:50%;transform:translateX(-50%);width:76px;height:76px;border-radius:50%;border:0;
  background:var(--gold);color:var(--ink);font:400 20px var(--display);box-shadow:0 5px 0 rgba(0,0,0,.35)}
#horn:active{transform:translate(-50%,4px)}
.toast{position:fixed;left:0;right:0;top:34%;text-align:center;font:400 clamp(30px,9vw,54px) var(--display);color:var(--gold);
  text-shadow:0 4px 0 var(--ink),0 0 18px rgba(0,0,0,.4);pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;transform:scale(.85)}
.toast.show{opacity:1;transform:scale(1)}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(29,22,48,.72);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(420px,100%);background:var(--paper);color:var(--ink);border-radius:26px;padding:24px 22px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3);font:500 16px/1.45 var(--body)}
.card h1{font:400 clamp(34px,10vw,48px)/1 var(--display);margin:0 0 10px;color:var(--gas);text-wrap:balance}
.card p{margin:8px 0}
.card .big{font:400 42px var(--display);margin:6px 0}
.card button{margin-top:14px;width:100%;height:58px;border:0;border-radius:18px;background:var(--gas);color:#fff;font:400 26px var(--display);box-shadow:0 5px 0 #b34d14;cursor:pointer}
.card button:active{transform:translateY(3px);box-shadow:0 2px 0 #b34d14}
.card small{display:block;color:#6b5f80;margin-top:10px;font-size:13px}
.rows{display:grid;gap:6px;margin:12px 0;text-align:left}
.row{display:flex;justify-content:space-between;gap:10px;background:#f3e6cf;border-radius:12px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.row.me{background:#ffd9b8}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head><body>
<canvas id="c" aria-label="Гонка фургонов"></canvas>
<div class="hud">
  <div class="pill" id="place">1/3</div>
  <div class="pill" id="cargo" aria-label="Котокролики на крыше"></div>
  <div class="pill" id="info">0 м · 0 км/ч</div>
</div>
<div class="track" id="track"><span class="flag">ФИНИШ</span></div>
<button class="btn" id="brake" aria-label="Тормоз и назад">ТОРМОЗ</button>
<button class="btn" id="gas" aria-label="Газ">ГАЗ</button>
<div class="toast" id="toast"></div>
<div class="screen" id="rotate" hidden><div class="card"><h1>Поверни телефон</h1><p>Игра горизонтальная: так видно трассу впереди.</p></div></div>

<div class="screen" id="start">
  <div class="card">
    <h1>Фургонные гонки</h1>
    <p>Довези котокроликов на крыше до финиша и обгони «Буханку» и «Газельку».</p>
    <p><b>ГАЗ</b> справа, <b>ТОРМОЗ</b> слева. В воздухе ими же наклоняешь фургон.</p>
    <button id="go">Поехали</button>
    <small>На компьютере: стрелки или A/D</small>
  </div>
</div>
<div class="screen" id="end" hidden>
  <div class="card">
    <h1 id="endTitle">Финиш!</h1>
    <div class="big" id="endPlace">1 место</div>
    <div class="rows" id="endRows"></div>
    <p id="endCargo"></p>
    <button id="again">Ещё раз</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/planck@1.0.6/dist/planck.min.js"></script>
<script>
const pl=planck,V=(x,y)=>planck.Vec2(x,y);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let DPR=1,CW=0,CH=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);CW=innerWidth;CH=innerHeight;cv.width=CW*DPR;cv.height=CH*DPR;}
addEventListener('resize',resize);resize();
function checkRot(){const r=document.getElementById('rotate');if(r)r.hidden=!(innerHeight>innerWidth&&innerWidth<820);}
addEventListener('resize',checkRot);addEventListener('orientationchange',checkRot);setTimeout(checkRot,0);

// ---------- трасса ----------
const FINISH=900,LEN=FINISH+60;
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return seed/2147483647;}}
let ground=[];
function makeGround(seed){
  const r=rng(seed),pts=[];
  let ramps=[];for(let x=90;x<FINISH-30;x+=70+r()*60)ramps.push({x,h:1.2+r()*1.8,w:6+r()*5});
  const bumps=[];for(let x=40;x<FINISH;x+=25+r()*35)bumps.push({x,h:0.25+r()*0.35});
  const p1=r()*6,p2=r()*6,p3=r()*6;
  for(let x=-30;x<=LEN;x+=1){
    const k=Math.min(1,Math.max(0,(x-25)/120));      // старт ровный, дальше всё круче
    let y=k*(3.2*Math.sin(x/37+p1)+1.6*Math.sin(x/17+p2)+0.5*Math.sin(x/7+p3))+x*0.004*k;
    for(const b of ramps){const d=x-b.x;if(d>-b.w&&d<0)y+=b.h*(1+d/b.w)*(1+d/b.w);}           // трамплин
    for(const b of bumps){const d=Math.abs(x-b.x);if(d<1.2)y+=b.h*Math.cos(d/1.2*Math.PI/2)**2;} // «лежачие полицейские»
    if(x>FINISH-8)y=pts[pts.length-1][1]*0.9+y*0.1;
    pts.push([x,y]);
  }
  return pts;
}
function groundY(x){const i=Math.floor(x+30);const a=ground[Math.max(0,Math.min(ground.length-2,i))],b=ground[Math.max(1,Math.min(ground.length-1,i+1))];const t=x+30-i;return a[1]+(b[1]-a[1])*t;}

// ---------- мир ----------
let world,vans=[],cargo=[],me,state='menu',T=0,startT=0,finishTimes={};
const CAT={x:0.8,y:0.8};
function buildVan(x,opt){
  const b=world.createBody({type:'dynamic',position:V(x,groundY(x)+1.6),angularDamping:0.3});
  const grp=-(opt.id+1);   // колёса не цепляют свой кузов
  b.createFixture(pl.Polygon([V(-1.6,-0.35),V(1.55,-0.35),V(1.6,0.25),V(1.05,0.75),V(-1.6,0.75)]),{density:1.1,friction:0.4,filterGroupIndex:grp,filterCategoryBits:2,filterMaskBits:5});
  b.createFixture(pl.Box(1.3,0.12,V(0,-0.25),0),{density:6,filterGroupIndex:grp,filterCategoryBits:2,filterMaskBits:5});
  // рейлинги на крыше, чтобы груз хоть как-то держался
  b.createFixture(pl.Box(0.06,0.4,V(-1.53,1.14),0),{density:0.2,filterGroupIndex:grp,filterCategoryBits:2,filterMaskBits:5});
  b.createFixture(pl.Box(0.06,0.38,V(0.95,1.12),0),{density:0.2,filterGroupIndex:grp,filterCategoryBits:2,filterMaskBits:5});
  const wheels=[];
  for(const wx of[-1.05,1.0]){
    const w=world.createBody({type:'dynamic',position:V(x+wx,groundY(x)+1.0)});
    w.createFixture(pl.Circle(0.46),{density:1.4,friction:0.95,filterGroupIndex:grp,filterCategoryBits:2,filterMaskBits:5});
    const j=world.createJoint(pl.WheelJoint({motorSpeed:0,maxMotorTorque:opt.torque,enableMotor:true,frequencyHz:4.2,dampingRatio:0.55},b,w,w.getPosition(),V(0,1)));
    wheels.push({b:w,j});
  }
  const v={id:opt.id,name:opt.name,color:opt.color,trim:opt.trim,body:b,wheels,bot:opt.bot,top:opt.top,gas:0,air:0,flip:0,lastLand:0,finished:false,checkpoint:x,honk:0};
  b.setUserData({van:v});return v;
}
function addCargo(v){
  for(let i=0;i<4;i++){
    const p=v.body.getWorldPoint(V(-1.2+i*0.6,1.05));
    const c=world.createBody({type:'dynamic',position:p,angle:v.body.getAngle()});
    c.createFixture(pl.Box(CAT.x/2*0.68,CAT.y/2*0.68),{density:0.9,friction:2.0,restitution:0.0,filterCategoryBits:4,filterMaskBits:7});
    cargo.push({b:c,lost:false,seed:i});
  }
}
function reset(){
  world=pl.World({gravity:V(0,-14)});
  ground=makeGround(7+Math.floor(Math.random()*1000));
  const gb=world.createBody();
  for(let i=0;i<ground.length-1;i+=1){}
  gb.createFixture(pl.Chain(ground.map(p=>V(p[0],p[1])),false),{friction:0.9});
  gb.createFixture(pl.Edge(V(-30,ground[0][1]),V(-30,ground[0][1]+30)));
  vans=[];cargo=[];
  me=buildVan(0,{id:0,name:'ТЫ',color:'#ff7a2f',trim:'#fff6e8',torque:95,top:42});
  vans.push(me);
  vans.push(buildVan(-6,{id:1,name:'Буханка',color:'#5c8a3a',trim:'#e9e2c4',torque:90,top:40,bot:true}));
  vans.push(buildVan(-12,{id:2,name:'Газелька',color:'#e8edf3',trim:'#3a8dde',torque:92,top:41,bot:true}));
  addCargo(me);
  T=0;finishTimes={};particles=[];shake=0;camX=me.body.getPosition().x;camY=me.body.getPosition().y;camY0=camY;zoom=1;lead=0;
}

// ---------- управление ----------
const keys={gas:false,brake:false};
function bindBtn(id,k){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=true;el.classList.add('on');audioOn();},off=e=>{e.preventDefault();keys[k]=false;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
bindBtn('gas','gas');bindBtn('brake','brake');
addEventListener('keydown',e=>{if(['ArrowRight','KeyD','ArrowUp'].includes(e.code))keys.gas=true;if(['ArrowLeft','KeyA','ArrowDown'].includes(e.code))keys.brake=true;});
addEventListener('keyup',e=>{if(['ArrowRight','KeyD','ArrowUp'].includes(e.code))keys.gas=false;if(['ArrowLeft','KeyA','ArrowDown'].includes(e.code))keys.brake=false;});

function audioOn(){}function honk(v){v.honk=0;}function thud(){}

// ---------- тосты ----------
const toastEl=document.getElementById('toast');let toastT=0;
function toast(s,dur=1.1){toastEl.textContent=s;toastEl.classList.add('show');toastT=dur;}

// ---------- физика / логика ----------
function drive(v,dt){
  const b=v.body,a=b.getAngle(),vel=b.getLinearVelocity();
  let gas=0;
  if(!v.bot){gas=keys.gas?1:keys.brake?-1:0;}
  else{
    // боты: всегда газуют, но подстраиваются под игрока, чтобы гонка была плотной
    const dx=b.getPosition().x-me.body.getPosition().x;
    gas=dx>18?0.55:dx>6?0.85:1;if(dx<-25)gas=1;
    if(v.air>0.15){gas=a>0.35?-1:a<-0.35?1:gas*0.3;}
    if(Math.random()<0.002)honk(v,0.6);
  }
  if(state!=='race')gas=0;
  v.gas=gas;
  const ms=gas>0?-v.top*gas:gas<0?18:0;
  for(const w of v.wheels){w.j.setMotorSpeed(ms);w.j.setMaxMotorTorque(gas===0?12:(gas>0?60:45));}
  // в воздухе газ/тормоз крутят фургон (как в хилл-клайм)
  const grounded=v.wheels.some(w=>{for(let ce=w.b.getContactList();ce;ce=ce.next)if(ce.contact.isTouching())return true;return false;});
  if(!grounded){v.air+=dt;b.applyAngularImpulse(gas*2.2*dt*10,true);}
  else{if(v.air>0.9&&v===me){toast('ПОЛЁТ '+v.air.toFixed(1)+' с',0.9);}if(v.air>0.5){shake=Math.max(shake,v===me?Math.min(0.5,v.air*0.3):0);if(v===me)thud(v.air*3);}v.air=0;}
  // перевернулся: через секунду ставим обратно на колёса
  const up=Math.cos(a);
  if(up<-0.1){v.flip+=dt;if(v.flip>1.2){const p=b.getPosition();const nx=Math.max(p.x-2,0);place(v,nx);if(v===me)toast('ВВЕРХ КОЛЁСАМИ',1);v.flip=0;}}else v.flip=0;
  // застрял (газ жмём, а не едем) — ставим чуть дальше
  if(gas>0&&vel.length()<0.6){v.stuck=(v.stuck||0)+dt;if(v.stuck>2.5){place(v,b.getPosition().x+3);v.stuck=0;if(v===me)toast('ПИНОК',0.8);}}else v.stuck=0;
  if(v.honk>0)v.honk-=dt;
}
function place(v,x){
  const y=groundY(x)+1.8;v.body.setTransform(V(x,y),0);v.body.setLinearVelocity(V(0,0));v.body.setAngularVelocity(0);
  for(const w of v.wheels){const lp=w===v.wheels[0]?-1.05:1.0;w.b.setTransform(V(x+lp,y-0.6),0);w.b.setLinearVelocity(V(0,0));w.b.setAngularVelocity(0);snap(w.b);}snap(v.body);
}
let particles=[],shake=0,camX=0,camY=0,zoom=1,lead=0,camY0=0;
function cargoOn(){let n=0;for(const c of cargo){if(c.lost)continue;const lp=me.body.getLocalPoint(c.b.getPosition());
  if(lp.x<-2.6||lp.x>2.2||lp.y<0.1||lp.y>4){c.lost=true;toast('−1 котокролик',0.9);}else n++;}return n;}
let ALPHA=1;
function P(b){const p=b.getPosition();if(b._px===undefined)return p;return {x:b._px+(p.x-b._px)*ALPHA,y:b._py+(p.y-b._py)*ALPHA};}
function A(b){const a=b.getAngle();return b._pa===undefined?a:b._pa+(a-b._pa)*ALPHA;}
function snap(b){const p=b.getPosition();b._px=p.x;b._py=p.y;b._pa=b.getAngle();}
function step(dt){
  T+=dt;
  for(let b=world.getBodyList();b;b=b.getNext())snap(b);
  for(const v of vans)drive(v,dt);
  world.step(dt,8,3);
  for(const v of vans){const p=v.body.getPosition();
    if(!v.finished&&p.x>=FINISH){v.finished=true;finishTimes[v.id]=T-startT;if(v===me)endRace();}
    const sp=v.body.getLinearVelocity().length();
    if(false){const w=v.wheels[0].b.getPosition();particles.push({x:w.x-0.3,y:w.y-0.35,vx:-1-Math.random()*2,vy:0.6+Math.random()*1.2,life:0.7,r:0.18+Math.random()*0.2});}
  }
  for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=1.5*dt;q.life-=dt;q.r+=dt*0.4;}
  particles=particles.filter(q=>q.life>0);
  if(state==='race')cargoOn();
  shake=Math.max(0,shake-dt*1.5);
}

// ---------- рисование ----------
function W2S(x,y){return[(x-camX)*S+CW*0.42,CH*0.64-(y-camY)*S];}
let S=40;
// утренний пейзаж: небо, солнце в дымке, облака, горы со снегом, туман, два слоя леса
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function drawSky(){
  const BY=Math.max(-CH*0.4,Math.min(CH*0.4,(camY-camY0)*S));
  const g=ctx.createLinearGradient(0,0,0,CH*0.75);g.addColorStop(0,'#6fb3e8');g.addColorStop(0.55,'#b9dcf2');g.addColorStop(1,'#fbe8c4');
  ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
  const sx=CW*0.78,sy=CH*0.2+BY*0.02,sr=CH*0.07;
  const sg=ctx.createRadialGradient(sx,sy,sr*0.3,sx,sy,sr*4);sg.addColorStop(0,'rgba(255,248,215,.95)');sg.addColorStop(0.25,'rgba(255,240,190,.45)');sg.addColorStop(1,'rgba(255,240,190,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,0,CW,CH);ctx.fillStyle='#fffbe8';ctx.beginPath();ctx.arc(sx,sy,sr,0,7);ctx.fill();
  // облака
  for(let i=0;i<7;i++){const span=CW+CH;const x=((hash(i)*span-camX*S*0.03-T*S*0.15*(0.5+hash(i+9)))%span+span)%span-CH*0.4,y=CH*(0.06+hash(i+3)*0.22),r=CH*(0.035+hash(i+5)*0.03);
    ctx.fillStyle='rgba(255,255,255,.85)';ctx.beginPath();ctx.ellipse(x,y,r*2.4,r,0,0,7);ctx.ellipse(x+r*1.3,y-r*0.5,r*1.5,r*0.9,0,0,7);ctx.ellipse(x-r*1.2,y-r*0.3,r*1.2,r*0.75,0,0,7);ctx.fill();}
  // горы: дальние и ближние, у дальних снежные шапки
  mountains(0.06,CH*0.56+BY*0.06,CH*0.36,'#9db6d6','#f4f8ff',1);
  mountains(0.12,CH*0.62+BY*0.12,CH*0.26,'#7f9cc0','#e8f0fb',2);
  const mist=ctx.createLinearGradient(0,CH*0.5+BY*0.15,0,CH*0.72+BY*0.15);mist.addColorStop(0,'rgba(251,232,196,0)');mist.addColorStop(1,'rgba(251,240,220,.75)');ctx.fillStyle=mist;ctx.fillRect(0,CH*0.5+BY*0.15,CW,CH*0.22);
  forest(0.22,CH*0.70+BY*0.22,CH*0.13,'#5f8f74',3);
  forest(0.38,CH*0.76+BY*0.38,CH*0.17,'#3f6f55',4);
}
function mountains(par,base,hgt,col,snow,seed){
  const step=CH*0.5,off=camX*S*par,i0=Math.floor((off-step)/step),i1=Math.ceil((off+CW+step)/step);
  for(let i=i0;i<=i1;i++){const x=i*step-off+hash(i*7+seed)*step*0.5,h=hgt*(0.55+0.45*hash(i*3+seed)),w=step*(0.75+0.5*hash(i*5+seed));
    ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w,base);ctx.lineTo(x-w*0.15,base-h*0.92);ctx.lineTo(x,base-h);ctx.lineTo(x+w*0.2,base-h*0.9);ctx.lineTo(x+w,base);ctx.fill();
    ctx.fillStyle='rgba(0,20,60,.08)';ctx.beginPath();ctx.moveTo(x,base-h);ctx.lineTo(x+w*0.2,base-h*0.9);ctx.lineTo(x+w,base);ctx.lineTo(x+w*0.1,base);ctx.fill();   // теневая сторона
    ctx.fillStyle=snow;ctx.beginPath();ctx.moveTo(x-w*0.15*0.32-w*0.1,base-h*0.78);ctx.lineTo(x-w*0.15,base-h*0.92);ctx.lineTo(x,base-h);ctx.lineTo(x+w*0.2,base-h*0.9);ctx.lineTo(x+w*0.26,base-h*0.8);
    ctx.lineTo(x+w*0.12,base-h*0.84);ctx.lineTo(x+w*0.02,base-h*0.76);ctx.lineTo(x-w*0.08,base-h*0.83);ctx.fill();}
}
function forest(par,base,hgt,col,seed){
  ctx.fillStyle=col;ctx.fillRect(0,base,CW,CH-base);
  const step=CH*0.035,off=camX*S*par,i0=Math.floor(off/step)-2,i1=Math.ceil((off+CW)/step)+2;
  for(let i=i0;i<=i1;i++){const x=i*step-off,h=hgt*(0.45+0.55*hash(i*13+seed)),w=h*0.32;const y=base;
    ctx.beginPath();for(let k=0;k<3;k++){const yy=y-h*(k*0.28),ww=w*(1-k*0.22);ctx.moveTo(x-ww,yy);ctx.lineTo(x,yy-h*0.48);ctx.lineTo(x+ww,yy);}ctx.fill();}
}
function drawGround(){
  const x0=camX-CW*0.42/S-2,x1=camX+CW*0.58/S+2;
  const path=()=>{ctx.beginPath();let first=true;for(let x=Math.floor(x0);x<=x1;x+=0.5){const[sx,sy]=W2S(x,groundY(x));first?ctx.moveTo(sx,sy):ctx.lineTo(sx,sy);first=false;}};
  path();ctx.lineTo(CW+20,CH+20);ctx.lineTo(-20,CH+20);ctx.closePath();
  const g=ctx.createLinearGradient(0,CH*0.55,0,CH);g.addColorStop(0,'#9a6a43');g.addColorStop(1,'#5b3a2a');ctx.fillStyle=g;ctx.fill();
  // слои грунта и камушки
  for(let x=Math.floor(x0);x<=x1;x+=1.3){const h=hash(Math.floor(x*10));if(h<0.55)continue;const[sx,sy]=W2S(x,groundY(x)-0.6-h*1.8);ctx.fillStyle='rgba(60,35,25,.35)';ctx.beginPath();ctx.ellipse(sx,sy,S*(0.12+h*0.15),S*(0.07+h*0.08),0,0,7);ctx.fill();}
  // трава: тёмная подложка + светлая кромка
  ctx.lineJoin='round';ctx.lineCap='round';
  path();ctx.lineWidth=S*0.42;ctx.strokeStyle='#4f9a3a';ctx.stroke();
  path();ctx.lineWidth=S*0.16;ctx.strokeStyle='#8fd65a';ctx.stroke();
  // кустики и цветы вдоль дороги
  for(let x=Math.floor(x0);x<=x1;x+=0.9){const h=hash(Math.floor(x*3)+77);if(h<0.7)continue;const[sx,sy]=W2S(x,groundY(x));
    ctx.fillStyle='#3f8a35';ctx.beginPath();ctx.arc(sx-S*0.12,sy-S*0.08,S*0.16,0,7);ctx.arc(sx+S*0.1,sy-S*0.1,S*0.2,0,7);ctx.fill();
    if(h>0.86){ctx.fillStyle=h>0.93?'#ffe066':'#ff8fb3';ctx.beginPath();ctx.arc(sx,sy-S*0.22,S*0.06,0,7);ctx.fill();}}
  // столбики с метрами и финиш
  ctx.font='800 '+Math.round(S*0.3)+'px Rubik, system-ui';ctx.textAlign='center';
  for(let m=Math.ceil(x0/50)*50;m<x1;m+=50){if(m<=0||m>=FINISH)continue;const[sx,sy]=W2S(m,groundY(m));ctx.fillStyle='#fffaf0';ctx.fillRect(sx-S*0.05,sy-S*1.2,S*0.1,S*1.2);ctx.fillStyle='#e0473b';ctx.fillRect(sx-S*0.05,sy-S*1.2,S*0.1,S*0.25);
    ctx.fillStyle='#2b2a3a';ctx.fillText(m+' м',sx,sy-S*1.32);}
  if(FINISH>x0&&FINISH<x1){const[sx,sy]=W2S(FINISH,groundY(FINISH));const h=S*3.2,cs=S*0.3;
    ctx.fillStyle='#fff';ctx.fillRect(sx-3,sy-h,6,h);
    for(let i=0;i<6;i++)for(let j=0;j<3;j++){ctx.fillStyle=(i+j)%2?'#1d1630':'#fff';ctx.fillRect(sx+3+i*cs,sy-h+j*cs,cs,cs);}}
}
// фургон рисуем в его собственных координатах (метры, ось y вверх)
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;r=Math.round(r*k);g=Math.round(g*k);b=Math.round(b*k);return 'rgb('+Math.min(255,r)+','+Math.min(255,g)+','+Math.min(255,b)+')';}
function drawVan(v){
  const b=v.body,p=P(b);
  // тень на земле
  {const gy=groundY(p.x);const[sx,sy]=W2S(p.x,gy);const d=Math.max(0,p.y-gy-0.9);ctx.fillStyle='rgba(40,30,20,'+Math.max(0,0.28-d*0.06)+')';ctx.beginPath();ctx.ellipse(sx,sy+S*0.05,S*(1.7+d*0.2),S*0.16,0,0,7);ctx.fill();}
  // колёса: шина, протектор, диск
  for(const w of v.wheels){const wp=P(w.b);const[sx,sy]=W2S(wp.x,wp.y);const r=0.46*S,a=-A(w.b);
    ctx.fillStyle='#22202b';ctx.beginPath();ctx.arc(sx,sy,r,0,7);ctx.fill();
    ctx.strokeStyle='#3a3746';ctx.lineWidth=S*0.05;for(let k=0;k<12;k++){const aa=a+k*0.5236;ctx.beginPath();ctx.moveTo(sx+Math.cos(aa)*r*0.82,sy+Math.sin(aa)*r*0.82);ctx.lineTo(sx+Math.cos(aa)*r*0.98,sy+Math.sin(aa)*r*0.98);ctx.stroke();}
    ctx.fillStyle='#d9dbe4';ctx.beginPath();ctx.arc(sx,sy,r*0.5,0,7);ctx.fill();ctx.fillStyle='#9a9caa';
    for(let k=0;k<5;k++){const aa=a+k*1.2566;ctx.beginPath();ctx.arc(sx+Math.cos(aa)*r*0.28,sy+Math.sin(aa)*r*0.28,r*0.07,0,7);ctx.fill();}
    ctx.beginPath();ctx.arc(sx,sy,r*0.12,0,7);ctx.fill();}
  const[sx,sy]=W2S(p.x,p.y);
  ctx.save();ctx.translate(sx,sy);ctx.rotate(-A(b));ctx.scale(S,-S);
  const lw=0.055,ink='#1e1b2a';ctx.lineWidth=lw;ctx.strokeStyle=ink;ctx.lineJoin='round';
  const body=()=>{ctx.beginPath();ctx.moveTo(-1.6,-0.3);ctx.lineTo(1.5,-0.3);ctx.quadraticCurveTo(1.64,-0.3,1.64,-0.15);ctx.lineTo(1.62,0.2);ctx.quadraticCurveTo(1.6,0.3,1.45,0.34);
    ctx.lineTo(1.12,0.72);ctx.quadraticCurveTo(1.05,0.8,0.95,0.8);ctx.lineTo(-1.45,0.8);ctx.quadraticCurveTo(-1.62,0.8,-1.62,0.62);ctx.lineTo(-1.62,-0.15);ctx.quadraticCurveTo(-1.62,-0.3,-1.6,-0.3);ctx.closePath();};
  body();const gr=ctx.createLinearGradient(0,0.8,0,-0.3);gr.addColorStop(0,shade(v.color,1.12));gr.addColorStop(0.55,v.color);gr.addColorStop(1,shade(v.color,0.78));ctx.fillStyle=gr;ctx.fill();
  // полоса и колёсные арки
  ctx.save();body();ctx.clip();ctx.fillStyle=v.trim;ctx.fillRect(-1.7,-0.02,3.4,0.11);
  ctx.fillStyle='rgba(20,15,30,.85)';for(const wx of[-1.05,1.0]){ctx.beginPath();ctx.arc(wx,-0.33,0.58,0,Math.PI);ctx.fill();}ctx.restore();
  body();ctx.stroke();
  // окна: лобовое, водительское, ряд в салоне
  const glass=ctx.createLinearGradient(0,0.75,0,0.25);glass.addColorStop(0,'#d8f1ff');glass.addColorStop(1,'#7fbde0');
  ctx.fillStyle=glass;
  ctx.beginPath();ctx.moveTo(0.98,0.7);ctx.lineTo(1.36,0.33);ctx.lineTo(0.98,0.33);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.roundRect(0.42,0.33,0.48,0.38,0.06);ctx.fill();ctx.stroke();
  for(const wx of[-1.4,-0.85,-0.3]){ctx.beginPath();ctx.roundRect(wx,0.36,0.46,0.33,0.06);ctx.fill();ctx.stroke();}
  ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=0.04;ctx.beginPath();ctx.moveTo(1.05,0.62);ctx.lineTo(1.18,0.48);ctx.stroke();   // блик
  ctx.strokeStyle=ink;ctx.lineWidth=0.03;
  ctx.beginPath();ctx.moveTo(0.3,0.78);ctx.lineTo(0.3,-0.28);ctx.moveTo(-1.48,0.78);ctx.lineTo(-1.48,-0.28);ctx.stroke();               // двери
  ctx.beginPath();ctx.moveTo(-0.2,0.2);ctx.lineTo(0.2,0.2);ctx.stroke();                                                              // ручка сдвижной двери
  ctx.fillStyle=ink;ctx.beginPath();ctx.roundRect(0.92,0.42,0.1,0.16,0.03);ctx.fill();                                                  // зеркало
  ctx.fillStyle='#fff3b0';ctx.beginPath();ctx.roundRect(1.5,0.05,0.13,0.14,0.04);ctx.fill();ctx.lineWidth=0.025;ctx.stroke();          // фара
  ctx.fillStyle='#e0473b';ctx.beginPath();ctx.roundRect(-1.63,0.05,0.08,0.18,0.03);ctx.fill();                                          // стоп-сигнал
  ctx.fillStyle='#55525f';ctx.beginPath();ctx.roundRect(1.2,-0.34,0.48,0.12,0.05);ctx.roundRect(-1.68,-0.34,0.4,0.12,0.05);ctx.fill();  // бамперы
  // багажник на крыше
  ctx.fillStyle=ink;ctx.fillRect(-1.59,0.8,0.12,0.74);ctx.fillRect(0.89,0.8,0.12,0.7);ctx.fillRect(-1.58,1.18,2.58,0.06);ctx.fillRect(-0.4,0.8,0.06,0.42);
  ctx.restore();
  // имя
  const[nx,ny]=W2S(p.x,p.y+2.0);ctx.font='800 '+Math.round(S*0.3)+'px Rubik, system-ui';ctx.textAlign='center';
  ctx.fillStyle='rgba(30,27,42,.6)';const tw=ctx.measureText(v.name).width+S*0.4;ctx.beginPath();ctx.roundRect(nx-tw/2,ny-S*0.3,tw,S*0.46,S*0.2);ctx.fill();ctx.fillStyle='#fffaf0';ctx.fillText(v.name,nx,ny+S*0.04);
}
function drawCat(c){
  const b=c.b,p=P(b);const[sx,sy]=W2S(p.x,p.y);const s=CAT.x*0.68*S;
  ctx.save();ctx.translate(sx,sy);ctx.rotate(-A(b));
  ctx.fillStyle='#d9772e';ctx.beginPath();ctx.ellipse(-s*0.52,-s*0.05,s*0.16,s*0.36,0.15,0,7);ctx.ellipse(s*0.52,-s*0.05,s*0.16,s*0.36,-0.15,0,7);ctx.fill();   // висячие уши
  ctx.fillStyle='#f39a4a';ctx.strokeStyle='#1d1630';ctx.lineWidth=Math.max(1.5,S*0.04);ctx.beginPath();ctx.roundRect(-s/2,-s/2,s,s,s*0.22);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1d1630';ctx.beginPath();ctx.arc(-s*0.18,-s*0.05,s*0.09,0,7);ctx.arc(s*0.18,-s*0.05,s*0.09,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-s*0.15,-s*0.09,s*0.03,0,7);ctx.arc(s*0.21,-s*0.09,s*0.03,0,7);ctx.fill();
  ctx.fillStyle='#ff8aa0';ctx.beginPath();ctx.arc(0,s*0.1,s*0.05,0,7);ctx.fill();
  ctx.restore();
}
function render(dt){
  const mp=P(me.body),sp=me.body.getLinearVelocity().length();
  const base=CH/8.5;            // в кадре ~8.5 м по высоте, по ширине — сколько влезет
  // камера: сглаживание по времени, а не по кадрам — одинаково на 60 и 120 Гц
  const kz=1-Math.exp(-dt*1.5),kx=1-Math.exp(-dt*9),ky=1-Math.exp(-dt*3.5);
  zoom+=((1-Math.min(0.28,sp*0.01))-zoom)*kz;S=base*zoom;
  lead+=(Math.min(3,sp*0.1)-lead)*kz;camX+=(mp.x+lead-camX)*kx;camY+=(mp.y-camY)*ky;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawSky();drawGround();
  for(const q of particles){const[sx,sy]=W2S(q.x,q.y);ctx.fillStyle='rgba(222,190,150,'+Math.max(0,q.life)*0.8+')';ctx.beginPath();ctx.arc(sx,sy,q.r*S,0,7);ctx.fill();}
  for(const v of vans)if(v!==me)drawVan(v);
  for(const c of cargo)drawCat(c);
  drawVan(me);
}

// ---------- HUD ----------
const placeEl=document.getElementById('place'),infoEl=document.getElementById('info'),cargoEl=document.getElementById('cargo'),trackEl=document.getElementById('track');
const dots=[];for(const c of['#ff7a2f','#5c8a3a','#e8edf3']){const d=document.createElement('span');d.className='dot';d.style.background=c;trackEl.appendChild(d);dots.push(d);}
let lastCargo=-1;
function hud(){
  const xs=vans.map(v=>v.body.getPosition().x);
  const order=vans.map((v,i)=>({i,x:v.finished?1e6-finishTimes[v.id]:xs[i]})).sort((a,b)=>b.x-a.x);
  const pos=order.findIndex(o=>o.i===0)+1;placeEl.textContent=pos+'/3';
  infoEl.textContent=Math.max(0,Math.round(xs[0]))+' м · '+Math.round(me.body.getLinearVelocity().length()*3.6*0.6)+' км/ч';
  vans.forEach((v,i)=>dots[i].style.left=Math.max(0,Math.min(100,xs[i]/FINISH*100))+'%');
  const n=cargo.filter(c=>!c.lost).length;
  if(n!==lastCargo){lastCargo=n;cargoEl.innerHTML='';for(let i=0;i<4;i++){const s=document.createElement('span');s.style.cssText='width:16px;height:16px;border-radius:5px;display:inline-block;background:'+(i<n?'#f39a4a':'rgba(255,246,232,.25)');cargoEl.appendChild(s);}}
  return pos;
}

// ---------- ход игры ----------
function endRace(){
  state='end';
  const t=finishTimes[0],n=cargo.filter(c=>!c.lost).length;
  const order=vans.map(v=>({v,score:v.finished?finishTimes[v.id]:1e6-v.body.getPosition().x})).sort((a,b)=>a.score-b.score);
  const pos=order.findIndex(o=>o.v===me)+1;
  document.getElementById('endTitle').textContent=pos===1?'Победа!':pos===2?'Почти!':'Ну такое';
  document.getElementById('endPlace').textContent=pos+' место';
  document.getElementById('endRows').innerHTML=order.map((o,i)=>'<div class="row'+(o.v===me?' me':'')+'"><span>'+(i+1)+'. '+o.v.name+'</span><span>'+(o.v.finished?finishTimes[o.v.id].toFixed(1)+' с':'ещё едет')+'</span></div>').join('');
  document.getElementById('endCargo').textContent='Котокроликов довезено: '+n+' из 4'+(n===4?'. Все целы!':n===0?'. Все разбежались.':'');
  setTimeout(()=>{document.getElementById('end').hidden=false;},900);
}
function startRace(){
  reset();state='count';document.getElementById('start').hidden=true;document.getElementById('end').hidden=true;
  let k=3;toast('3',0.8);const iv=setInterval(()=>{k--;if(k>0)toast(String(k),0.8);else{clearInterval(iv);toast('ПОЕХАЛИ',0.9);state='race';startT=T;honk(vans[1],0.5);}},800);
}
document.getElementById('go').addEventListener('click',()=>{audioOn();startRace();});
document.getElementById('again').addEventListener('click',()=>{audioOn();startRace();});

reset();
let last=performance.now(),acc=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;acc+=dt;
  while(acc>=1/60){step(1/60);acc-=1/60;}
  ALPHA=acc*60;
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('show');}
  render(dt);hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
