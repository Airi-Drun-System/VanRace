<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2e4a8a">
<title>Фургонные гонки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Bubbles&family=Rubik:wght@500;800&display=swap">
<style>
/* Игрушечные фургоны в огромной комнате: мультяшный свет, обводка, крупные пальцевые кнопки по краям */
:root{
  --ink:#1d1630; --paper:#fff6e8; --gas:#ff7a2f; --brake:#3a8dde; --steer:#2b2840; --gold:#ffd04a;
  --display:"Rubik Bubbles","Arial Black",system-ui,sans-serif; --body:"Rubik",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#e9d9bf;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));
  display:flex;gap:8px;align-items:flex-start;justify-content:space-between;font:800 15px var(--body);color:var(--paper);pointer-events:none}
.grp{display:flex;gap:8px;align-items:flex-start}
.pill{background:rgba(29,22,48,.6);border-radius:14px;padding:6px 11px;font-variant-numeric:tabular-nums;white-space:nowrap}
#place{font:400 26px var(--display);line-height:1.1}
.hud button{pointer-events:auto;border:0;border-radius:14px;padding:7px 12px;background:rgba(29,22,48,.6);color:var(--paper);font:800 14px var(--body);cursor:pointer}
.ctl{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:12px;align-items:flex-end}
#left{left:max(14px,env(safe-area-inset-left,0px))}
#right{right:max(14px,env(safe-area-inset-right,0px))}
.btn{width:clamp(78px,min(19vw,24vh),120px);height:clamp(78px,min(19vw,24vh),120px);border-radius:24px;border:0;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.35);
  font:400 clamp(17px,min(4.2vw,5vh),24px) var(--display);touch-action:none;cursor:pointer;display:grid;place-items:center;background:var(--steer)}
.btn svg{width:46%;height:46%}
.btn.on{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:focus-visible,.hud button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#gas{background:var(--gas);height:clamp(96px,min(24vw,32vh),150px)}
#brake{background:var(--brake)}
.toast{position:fixed;left:0;right:0;top:30%;text-align:center;font:400 clamp(30px,8vh,56px) var(--display);color:var(--gold);
  text-shadow:0 4px 0 var(--ink);pointer-events:none;transition:opacity .25s,transform .25s;opacity:0;transform:scale(.85)}
.toast.show{opacity:1;transform:scale(1)}
.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(29,22,48,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{width:min(760px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--paper);color:var(--ink);border-radius:26px;padding:18px 20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.3);font:500 15px/1.4 var(--body);box-sizing:border-box}
.card h1{font:400 clamp(28px,7vh,46px)/1 var(--display);margin:0 0 8px;color:var(--gas);text-wrap:balance}
.card p{margin:6px 0}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
@media (max-aspect-ratio:1/1){.pick{grid-template-columns:repeat(3,1fr)}}
.pick button,.modes button{margin:0;padding:6px 4px 4px;background:#f3e6cf;border:3px solid transparent;border-radius:14px;color:var(--ink);font:800 12px var(--body);cursor:pointer}
.pick button img{width:100%;display:block}
.pick button[aria-checked="true"],.modes button[aria-checked="true"]{border-color:var(--gas);background:#ffe3cc}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.modes button{padding:10px;font-size:15px}
.modes small{display:block;font-weight:500;color:#6b5f80;font-size:12px}
.go{margin-top:8px;width:100%;height:54px;border:0;border-radius:18px;background:var(--gas);color:#fff;font:400 24px var(--display);box-shadow:0 5px 0 #b34d14;cursor:pointer}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #b34d14}
.hint{display:block;color:#6b5f80;margin-top:8px;font-size:12px}
.rows{display:grid;gap:6px;margin:12px 0;text-align:left}
.row{display:flex;justify-content:space-between;gap:10px;background:#f3e6cf;border-radius:12px;padding:8px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.row.me{background:#ffd9b8}
.big{font:400 40px var(--display);margin:4px 0}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

</head><body>
<canvas id="c" aria-label="Гонка игрушечных фургонов"></canvas>
<div class="hud">
  <div class="grp"><div class="pill" id="place" hidden>1/3</div><div class="pill" id="lap" hidden>Круг 1/2</div></div>
  <div class="grp"><div class="pill" id="info">0 км/ч</div><button id="flip" type="button">Перевернуть</button><button id="menu" type="button">Меню</button></div>
</div>
<div class="ctl" id="left">
  <button class="btn" id="l" aria-label="Влево"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4 7 12l8 8"/></svg></button>
  <button class="btn" id="r" aria-label="Вправо"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 8 8-8 8"/></svg></button>
</div>
<div class="ctl" id="right">
  <button class="btn" id="brake" aria-label="Тормоз и назад">НАЗАД</button>
  <button class="btn" id="gas" aria-label="Газ">ГАЗ</button>
</div>
<div class="toast" id="toast"></div>
<div class="screen" id="rotate" hidden><div class="card"><h1>Поверни телефон</h1><p>Игра горизонтальная.</p></div></div>

<div class="screen" id="start">
  <div class="card">
    <h1>Фургонные гонки</h1>
    <p>Игрушечные фургоны в огромной комнате: под столом, мимо дивана, через книжки.</p>
    <div class="modes" role="radiogroup" aria-label="Режим">
      <button type="button" role="radio" data-mode="race" aria-checked="true">Гонка<small>3 круга против двух фургонов</small></button>
      <button type="button" role="radio" data-mode="free" aria-checked="false">Фрирум<small>катайся где хочешь, без времени</small></button>
    </div>
    <div class="pick" id="pick" role="radiogroup" aria-label="Фургон"></div>
    <button class="go" id="go" type="button">Поехали</button>
    <span class="hint">Стрелки слева — руль, справа ГАЗ и НАЗАД. На компьютере: WASD или стрелки, R — перевернуть.</span>
  </div>
</div>
<div class="screen" id="end" hidden>
  <div class="card">
    <h1 id="endTitle">Финиш!</h1>
    <div class="big" id="endPlace">1 место</div>
    <div class="rows" id="endRows"></div>
    <button class="go" id="again" type="button">В меню</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import * as CANNON from 'cannon-es';

// ---------- рендер ----------
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,powerPreference:'high-performance'});
R.setPixelRatio(Math.min(2,window.devicePixelRatio||1));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#2e4a8a');scene.fog=new THREE.Fog('#c9b8a0',260,620);
const cam=new THREE.PerspectiveCamera(55,1,0.2,1200);
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w>h?55:72;cam.updateProjectionMatrix();
  document.getElementById('rotate').hidden=!(h>w&&w<820);}
addEventListener('resize',resize);addEventListener('orientationchange',resize);resize();

// мультяшный свет: ступенчатая градиентная карта для toon-материалов
const gm=new THREE.DataTexture(new Uint8Array([90,90,90,255,170,170,170,255,235,235,235,255,255,255,255,255]),4,1);gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;
const toon=(o)=>new THREE.MeshToonMaterial(Object.assign({gradientMap:gm},o));
const INK=new THREE.MeshBasicMaterial({color:'#1d1630',side:THREE.BackSide});
// обводка «как в мультике»: тот же меш, чуть раздутый, рисуем изнанкой чёрным
function outline(mesh,w=0.06){const g=mesh.geometry.clone();g.computeVertexNormals();const p=g.attributes.position,n=g.attributes.normal;
  for(let i=0;i<p.count;i++)p.setXYZ(i,p.getX(i)+n.getX(i)*w,p.getY(i)+n.getY(i)*w,p.getZ(i)+n.getZ(i)*w);
  const o=new THREE.Mesh(g,INK);o.raycast=()=>{};mesh.add(o);return o;}

scene.add(new THREE.HemisphereLight('#fff4e2','#7a5a3c',1.5));
const sun=new THREE.DirectionalLight('#fff1d8',2.6);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-45,right:45,top:45,bottom:-45,near:1,far:220});sun.shadow.bias=-0.0004;sun.shadow.normalBias=0.04;scene.add(sun,sun.target);
const SUNDIR=new THREE.Vector3(0.45,1,0.3).normalize();

function canvasTex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=R.capabilities.getMaxAnisotropy();
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);};

// ---------- физика ----------
const world=new CANNON.World({gravity:new CANNON.Vec3(0,-20,0)});world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=true;
world.defaultContactMaterial.friction=0.35;
const groundMat=new CANNON.Material('g'),wheelMat=new CANNON.Material('w');
world.addContactMaterial(new CANNON.ContactMaterial(groundMat,wheelMat,{friction:0.3,restitution:0}));
function staticBox(w,h,d,x,y,z,mat,ry=0,rx=0,rz=0,{cast=true,line=true,phys=true}={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);m.castShadow=cast;m.receiveShadow=true;scene.add(m);if(line)outline(m,0.08);
  if(phys){const b=new CANNON.Body({mass:0,material:groundMat,shape:new CANNON.Box(new CANNON.Vec3(w/2,h/2,d/2))});b.position.set(x,y,z);b.quaternion.setFromEuler(rx,ry,rz);world.addBody(b);}
  return m;}

// ---------- детская комната (масштаб игрушки: фургон ~4 м, значит всё вокруг огромное) ----------
// по референсу: синие стены со звёздами, паркет, игровой ковёр с дорогой, кровать со звёздным пледом, шкафы, кресло-мешок, коробка TOYS, конусы, кубики, трамплины
const RW=300,RD=220,WH=80;
const std=(o)=>new THREE.MeshStandardMaterial(Object.assign({roughness:0.85,metalness:0},o));
{const fl=new CANNON.Body({mass:0,material:groundMat,shape:new CANNON.Box(new CANNON.Vec3(RW/2,2,RD/2))});fl.position.y=-2;world.addBody(fl);}   // пол коробкой: с Plane лучи подвески часто «не видят» пол
const parquet=canvasTex(1024,1024,(g,w,h)=>{const pw=w/4,ph=h/16;for(let j=0;j<16;j++)for(let i=-1;i<5;i++){const off=(j%2)*pw/2,x=i*pw+off;

  const vis=new THREE.Group();vis.add(body);
  // стёкла на крыше-лобовом: тёмная полоса спереди для читаемости в 3D
  const front=Math.max(...m.poly.map(p=>X(p[0])));
  const ws=new THREE.Mesh(new THREE.BoxGeometry(0.05,(top-0.2)*0.32,VWD*0.82),toon({color:'#2a3d55'}));ws.position.set(front*0.74,top*0.72,0);ws.rotation.z=0.55;vis.add(ws);
  // зад и перед: нарисованные двери, окна, фонари, бампер (чтобы сзади был не просто цветной кирпич)
  const back=Math.min(...m.poly.map(p=>X(p[0]))),hb=top-0.25;
  const rear=new THREE.Mesh(new THREE.PlaneGeometry(VWD*0.94,hb),toon({transparent:true,map:canvasTex(256,256,(c,w,h)=>{
    c.fillStyle='rgba(0,0,0,.18)';c.fillRect(w/2-2,10,4,h*0.82);                                   // шов дверей
    c.fillStyle='#2a3d55';c.strokeStyle='#1d1630';c.lineWidth=8;for(const x of[18,w/2+10]){c.beginPath();c.roundRect(x,22,w/2-28,h*0.32,14);c.fill();c.stroke();}
    c.fillStyle='rgba(255,255,255,.35)';c.fillRect(30,32,16,40);c.fillRect(w/2+22,32,16,40);
    c.fillStyle='#e0473b';c.strokeStyle='#1d1630';c.lineWidth=6;for(const x of[6,w-30]){c.beginPath();c.roundRect(x,h*0.46,24,h*0.22,6);c.fill();c.stroke();}
    c.fillStyle='#1d1630';c.fillRect(w/2+26,h*0.55,26,8);c.fillRect(w/2-52,h*0.55,26,8);                // ручки
    c.fillStyle='#3b3946';c.beginPath();c.roundRect(0,h*0.84,w,h*0.16,10);c.fill();                 // бампер
    c.fillStyle='#f4f1ea';c.fillRect(w/2-34,h*0.72,68,24);c.fillStyle='#1d1630';c.font='800 20px Arial';c.textAlign='center';c.fillText('VEGAS',w/2,h*0.72+19);})}));
  rear.position.set(back-0.1,0.2+hb/2,0);rear.rotation.y=-Math.PI/2;vis.add(rear);
  const nose=Math.max(...m.poly.filter(p=>Y(p[1])<top*0.45).map(p=>X(p[0])));
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(VWD*0.94,top*0.38),toon({transparent:true,map:canvasTex(256,128,(c,w,h)=>{
    c.fillStyle='#fff3b0';c.strokeStyle='#1d1630';c.lineWidth=6;for(const x of[8,w-52]){c.beginPath();c.roundRect(x,18,44,30,10);c.fill();c.stroke();}
    c.fillStyle='#2b2933';c.beginPath();c.roundRect(64,20,w-128,32,8);c.fill();c.strokeStyle='#55525f';c.lineWidth=4;for(let i=0;i<5;i++){c.beginPath();c.moveTo(72,26+i*6);c.lineTo(w-72,26+i*6);c.stroke();}
    c.fillStyle='#3b3946';c.beginPath();c.roundRect(0,h-34,w,30,10);c.fill();})}));
  fr.position.set(nose+0.1,0.15+top*0.19,0);fr.rotation.y=Math.PI/2;vis.add(fr);
  // колёса
  const wg=new THREE.CylinderGeometry(wr,wr,0.55,28);wg.rotateX(Math.PI/2);
  const wheelM=[toon({color:'#26232f'}),toon({map:tex.wheel}),toon({map:tex.wheel})];
  const wheels=[];for(let i=0;i<4;i++){const w=new THREE.Mesh(wg,wheelM);w.castShadow=true;outline(w,0.05);scene.add(w);wheels.push(w);}
  scene.add(vis);
  // физика: корпус-коробка + рейкаст-подвеска
  const yb=0.95,cy=(yb+top)/2,cxs=(X(m.left)+X(m.right))/2;
  const chassis=new CANNON.Body({mass:120});
  chassis.addShape(new CANNON.Box(new CANNON.Vec3(VL/2,(top-yb)/2,VWD/2)),new CANNON.Vec3(cxs,cy,0));
  chassis.angularDamping=0.35;chassis.linearDamping=0.02;chassis.allowSleep=false;
  const veh=new CANNON.RaycastVehicle({chassisBody:chassis,indexRightAxis:2,indexUpAxis:1,indexForwardAxis:0});
  const opt={radius:wr,directionLocal:new CANNON.Vec3(0,-1,0),suspensionStiffness:40,suspensionRestLength:1.0,frictionSlip:2.6,dampingRelaxation:2.6,dampingCompression:4.2,
    maxSuspensionForce:1e5,rollInfluence:0.04,axleLocal:new CANNON.Vec3(0,0,1),maxSuspensionTravel:0.45,customSlidingRotationalSpeed:-30,useCustomSlidingRotationalSpeed:true};
  for(const x of wx)for(const z of[VWD/2-0.18,-VWD/2+0.18]){opt.chassisConnectionPointLocal=new CANNON.Vec3(x,1.0,z);veh.addWheel(opt);}
  veh.addToWorld(world);
  const car={k,isBot,name,lane,vis,wheels,chassis,veh,top,lap:0,ti:0,prog:0,half:false,finished:false,ftime:0,stuck:0,steer:0,label:null};
  // подпись
  const lab=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(256,64,(c,w,h)=>{c.fillStyle=isBot?'rgba(30,27,42,.75)':'rgba(255,122,47,.95)';c.beginPath();c.roundRect(4,8,w-8,h-16,24);c.fill();c.fillStyle='#fffaf0';c.font='800 34px Rubik, Arial';c.textAlign='center';c.textBaseline='middle';c.fillText(name,w/2,h/2+2);}),depthTest:false,transparent:true}));
  lab.scale.set(3.4,0.85,1);lab.renderOrder=10;scene.add(lab);car.label=lab;
  cars.push(car);return car;
}
function placeCar(c,t,lane){const p=curve.getPointAt(t),tg=curve.getTangentAt(t),n=new THREE.Vector3(-tg.z,0,tg.x);const q=p.clone().addScaledVector(n,lane);
  c.chassis.position.set(q.x,1.6,q.z);c.chassis.quaternion.setFromEuler(0,Math.atan2(-tg.z,tg.x),0);c.chassis.velocity.setZero();c.chassis.angularVelocity.setZero();
  const ti=trackT(q).i;c.ti=ti;c.stuck=0;}
function clearCars(){for(const c of cars){c.veh.removeFromWorld(world);scene.remove(c.vis);for(const w of c.wheels)scene.remove(w);scene.remove(c.label);}cars.length=0;}

// ---------- управление ----------
const keys={gas:0,brake:0,l:0,r:0};
for(const [id,k] of[['gas','gas'],['brake','brake'],['l','l'],['r','r']]){const el=document.getElementById(id);
  const on=e=>{e.preventDefault();keys[k]=1;el.classList.add('on');},off=e=>{e.preventDefault();keys[k]=0;el.classList.remove('on');};
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);}
const KM={KeyW:'gas',ArrowUp:'gas',KeyS:'brake',ArrowDown:'brake',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r'};
addEventListener('keydown',e=>{if(KM[e.code])keys[KM[e.code]]=1;if(e.code==='KeyR')flipMe();});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=0;});
const toastEl=document.getElementById('toast');let toastT=0;function toast(s,d=1.1){toastEl.textContent=s;toastEl.classList.add('show');toastT=d;}

// ---------- игровой цикл ----------
let mode='race',state='menu',me=null,T=0,startT=0,mySkin='red';
try{mySkin=localStorage.getItem('vanSkin')||'red';}catch(e){}if(!SPR[mySkin])mySkin='red';
const LAPS=3;
function flipMe(){if(!me)return;const q=me.chassis.quaternion,e=new CANNON.Vec3();q.toEuler(e);me.chassis.position.y+=2.5;me.chassis.quaternion.setFromEuler(0,e.y,0);me.chassis.angularVelocity.setZero();me.chassis.velocity.scale(0.2,me.chassis.velocity);}
document.getElementById('flip').addEventListener('click',flipMe);
function drive(c,dt){
  const v=c.chassis.velocity,fwd=new CANNON.Vec3(1,0,0);c.chassis.quaternion.vmult(fwd,fwd);const sp=v.dot(fwd);
  let gas=0,steer=0;
  if(!c.isBot){gas=keys.gas?1:keys.brake?-1:0;steer=(keys.l?1:0)-(keys.r?1:0);}
  else{ // бот едет по трассе с упреждением; на поворотах сбрасывает
    const look=(c.ti+Math.round(14+sp*0.9))%NS,tp=SAMP[look],tg=curve.getTangentAt(look/NS),n=new THREE.Vector3(-tg.z,0,tg.x);
    const tx=tp.x+n.x*c.lane,tz=tp.z+n.z*c.lane;const p=c.chassis.position;
    const ang=Math.atan2(-(tz-p.z),tx-p.x),e=new CANNON.Vec3();c.chassis.quaternion.toEuler(e);let d=ang-e.y;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;
    steer=Math.max(-1,Math.min(1,d*1.8));const tgt=24-Math.abs(d)*22;gas=sp<tgt?1:0.2;
    if(me&&!me.finished){const gap=c.prog-me.prog;if(gap>0.08)gas*=0.75;}
  }
  if(state!=='race'&&state!=='free')gas=0;
  c.steer+=(steer*0.55-c.steer)*Math.min(1,dt*8);
  const F=2600,maxSp=c.isBot?27:30;
  let force=0,brake=0;
  if(gas>0)force=sp<maxSp?F*gas:0;else if(gas<0){if(sp>1){brake=18;}else force=-F*0.6;}
  else brake=1.2;
  for(let i=0;i<4;i++){c.veh.applyEngineForce(i<2?0:force,i);c.veh.setBrake(brake,i);}
  c.veh.setSteeringValue(c.steer,2);c.veh.setSteeringValue(c.steer,3);
  // рули задней осью = передние колёса (по x больше — спереди)
  // прогресс по трассе
  const r=trackT(c.chassis.position,c.ti);const prev=c.ti;c.ti=r.i;
  if(mode==='race'&&!c.finished){
    if(c.ti>NS*0.45&&c.ti<NS*0.55)c.half=true;
    if(prev>NS*0.9&&c.ti<NS*0.1&&c.half){c.lap++;c.half=false;if(c===me&&c.lap<LAPS)toast('Круг '+(c.lap+1)+'/'+LAPS,1);if(c.lap>=LAPS){c.finished=true;c.ftime=T-startT;if(c===me)endRace();}}
    c.prog=c.lap+c.ti/NS;
  }
  // застрял или лежит на боку — ставим обратно на трассу
  const up=new CANNON.Vec3(0,1,0);c.chassis.quaternion.vmult(up,up);
  if((Math.abs(sp)<1&&(gas!==0))||up.y<0.2){c.stuck+=dt;if(c.stuck>(c.isBot?2:3.5)){if(c.isBot||mode==='race'){const t=c.ti/NS;placeCar(c,t,c.lane);}else flipMe();c.stuck=0;}}else c.stuck=0;
  return sp;
}
function syncVis(c){
  c.vis.position.copy(c.chassis.position);c.vis.quaternion.copy(c.chassis.quaternion);
  for(let i=0;i<4;i++){c.veh.updateWheelTransform(i);const t=c.veh.wheelInfos[i].worldTransform;c.wheels[i].position.copy(t.position);c.wheels[i].quaternion.copy(t.quaternion);}
  c.label.position.set(c.chassis.position.x,c.chassis.position.y+c.top+1.6,c.chassis.position.z);
}
// камера сзади, плавно, по времени
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let camInit=false;
function camera(dt,sp){
  const p=me.vis.position,f=new THREE.Vector3(1,0,0).applyQuaternion(me.vis.quaternion);f.y=0;f.normalize();
  const back=12+Math.min(6,Math.abs(sp)*0.15);
  const want=p.clone().addScaledVector(f,-back).add(new THREE.Vector3(0,6.2,0));
  want.x=Math.max(-RW/2+4,Math.min(RW/2-4,want.x));want.z=Math.max(-RD/2+4,Math.min(RD/2-4,want.z));
  const look=p.clone().addScaledVector(f,4).add(new THREE.Vector3(0,1.4,0));
  if(!camInit){camPos.copy(want);camLook.copy(look);camInit=true;}
  camPos.lerp(want,1-Math.exp(-dt*4.5));camLook.lerp(look,1-Math.exp(-dt*9));
  cam.position.copy(camPos);cam.lookAt(camLook);
  sun.position.copy(p).addScaledVector(SUNDIR,110);sun.target.position.copy(p);
}
function setHUD(sp){
  document.getElementById('info').textContent=Math.round(Math.abs(sp)*3.6*0.5)+' км/ч';
  if(mode==='race'&&me){const order=[...cars].sort((a,b)=>(b.finished?100-b.ftime/1000:b.prog)-(a.finished?100-a.ftime/1000:a.prog));
    document.getElementById('place').textContent=(order.indexOf(me)+1)+'/'+cars.length;
    document.getElementById('lap').textContent='Круг '+Math.min(LAPS,me.lap+1)+'/'+LAPS;}
}
function startGame(){
  clearCars();T=0;camInit=false;
  document.getElementById('place').hidden=document.getElementById('lap').hidden=mode!=='race';
  const others=Object.keys(SPR).filter(k=>k!==mySkin).sort(()=>Math.random()-0.5);
  me=makeCar(mySkin,false,'ТЫ',-3.4);placeCar(me,0.99,-3.4);
  if(mode==='race'){const b1=makeCar(others[0],true,SPR[others[0]].name,3.4);placeCar(b1,0.99,3.4);const b2=makeCar(others[1],true,SPR[others[1]].name,0);placeCar(b2,0.962,0);}
  document.getElementById('start').hidden=true;document.getElementById('end').hidden=true;
  if(mode==='race'){state='count';let k=3;toast('3',0.8);const iv=setInterval(()=>{k--;if(k>0)toast(String(k),0.8);else{clearInterval(iv);toast('ПОЕХАЛИ',0.9);state='race';startT=T;}},800);}
  else{state='free';toast('ФРИРУМ',1);}
}
function endRace(){
  state='end';const order=[...cars].sort((a,b)=>(a.finished?a.ftime:1e6-a.prog)-(b.finished?b.ftime:1e6-b.prog));const pos=order.indexOf(me)+1;
  document.getElementById('endTitle').textContent=pos===1?'Победа!':pos===2?'Почти!':'Ну такое';
  document.getElementById('endPlace').textContent=pos+' место';
  document.getElementById('endRows').innerHTML=order.map((c,i)=>'<div class="row'+(c===me?' me':'')+'"><span>'+(i+1)+'. '+c.name+'</span><span>'+(c.finished?c.ftime.toFixed(1)+' с':'ещё едет')+'</span></div>').join('');
  setTimeout(()=>{document.getElementById('end').hidden=false;},900);
}
document.getElementById('go').addEventListener('click',startGame);
document.getElementById('again').addEventListener('click',()=>{document.getElementById('end').hidden=true;document.getElementById('start').hidden=false;state='menu';});
document.getElementById('menu').addEventListener('click',()=>{document.getElementById('start').hidden=false;state='menu';});
// меню: режим и выбор фургона
for(const b of document.querySelectorAll('.modes button'))b.addEventListener('click',()=>{mode=b.dataset.mode;document.querySelectorAll('.modes button').forEach(x=>x.setAttribute('aria-checked',x===b));});
{const pk=document.getElementById('pick');for(const k in SPR){const bt=document.createElement('button');bt.type='button';bt.setAttribute('role','radio');bt.setAttribute('aria-checked',k===mySkin);
  const im=document.createElement('img');im.alt='';im.src=SPR[k].thumb;bt.appendChild(im);bt.appendChild(document.createTextNode(SPR[k].name));
  bt.onclick=()=>{mySkin=k;try{localStorage.setItem('vanSkin',k);}catch(e){}pk.querySelectorAll('button').forEach(x=>x.setAttribute('aria-checked',x===bt));};pk.appendChild(bt);}}

// заставка за меню: фургон стоит на старте
mode='free';startGame();state='menu';document.getElementById('start').hidden=false;mode='race';

let last=performance.now(),acc=0;const DT=1/60;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;acc+=dt;
  let sp=0;
  while(acc>=DT){T+=DT;for(const c of cars)sp=c===me?drive(c,DT):(drive(c,DT),sp);world.step(DT);acc-=DT;}
  for(const c of cars)syncVis(c);for(const d of dyn){d.m.position.copy(d.b.position);d.m.quaternion.copy(d.b.quaternion);if(d.oy)d.m.translateY(d.oy);}
  if(me){const f=new CANNON.Vec3(1,0,0);me.chassis.quaternion.vmult(f,f);camera(dt,me.chassis.velocity.dot(f));setHUD(me.chassis.velocity.dot(f));}
  if(toastT>0){toastT-=dt;if(toastT<=0)toastEl.classList.remove('show');}
  if(!window.__norender)R.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
